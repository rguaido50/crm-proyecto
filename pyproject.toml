[project]
name = "crm"
version = "0.1.0"
description = "Internal CRM for itela: contacts, opportunities, tasks and pipeline reports"
readme = "README.md"
authors = [
    { name = "rguaido", email = "rguaido50@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "psycopg[binary,pool]==3.3.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.0.52",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.11",
    "mutmut>=3.8",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '--import-mode=importlib -m "not e2e"'
markers = [
    "e2e: browser end-to-end test against a running app (see CLAUDE.md commands)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[tool.mypy]
python_version = "3.13"
packages = ["crm"]

[tool.mutmut]
source_paths = ["src/crm"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
