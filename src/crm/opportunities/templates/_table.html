<table class="table">
  <thead>
    <tr>
      <th>Title</th>
      <th>Stage</th>
      <th>Status</th>
      <th>Value</th>
      <th>Owner</th>
    </tr>
  </thead>
  <tbody>
    {% for opp in opportunities %}
    <tr>
      <td><a href="/opportunities/{{ opp.id }}/edit">{{ opp.title }}</a></td>
      <td>{{ opp.stage.value }}</td>
      <td>{{ opp.status.value }}</td>
      <td>{{ opp.value_usd|currency }}</td>
      <td>{{ opp.owner }}</td>
    </tr>
    {% else %}
    <tr><td colspan="5" class="text-muted">No opportunities yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
