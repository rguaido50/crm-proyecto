{% extends "base.html" %}

{% block title %}Edit Opportunity{% endblock %}

{% block content %}
<h1 class="mb-3">Edit Opportunity</h1>
<form method="post" action="/opportunities/{{ opportunity.id }}/edit">
  <div class="mb-2">
    <label class="form-label" for="title">Title</label>
    <input class="form-control" type="text" id="title" name="title" value="{{ opportunity.title }}" required>
  </div>
  <div class="mb-2">
    <label class="form-label" for="value_usd">Value (USD)</label>
    <input class="form-control" type="number" step="0.01" id="value_usd" name="value_usd" value="{{ opportunity.value_usd if opportunity.value_usd is not none else '' }}">
  </div>
  <div class="mb-2">
    <label class="form-label" for="stage">Stage</label>
    <select class="form-select" id="stage" name="stage">
      {% for stage in stages %}
      <option value="{{ stage.value }}"{% if stage == opportunity.stage %} selected{% endif %}>{{ stage.value }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-2">
    <label class="form-label" for="status">Status</label>
    <select class="form-select" id="status" name="status">
      {% for status in statuses %}
      <option value="{{ status.value }}"{% if status == opportunity.status %} selected{% endif %}>{{ status.value }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-2">
    <label class="form-label" for="owner">Owner</label>
    <input class="form-control" type="text" id="owner" name="owner" value="{{ opportunity.owner }}" required>
  </div>
  <div class="mb-2">
    <label class="form-label" for="expected_close_date">Expected close date</label>
    <input class="form-control" type="date" id="expected_close_date" name="expected_close_date" value="{{ opportunity.expected_close_date or '' }}">
  </div>
  <button class="btn btn-primary" type="submit">Save Changes</button>
</form>
{% endblock %}
