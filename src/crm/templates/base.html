<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}itela CRM{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='bootstrap/bootstrap.min.css') }}">
  <script src="{{ url_for('static', path='htmx/htmx.min.js') }}" defer></script>
</head>
<body hx-boost="true">
  <div class="d-flex">
    <nav class="d-flex flex-column flex-shrink-0 p-3 bg-light border-end" style="width: 220px; min-height: 100vh;">
      <span class="fs-4 mb-3">itela CRM</span>
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item"><a href="/" class="nav-link link-dark">Home</a></li>
        <li class="nav-item"><a href="/contacts" class="nav-link link-dark">Contacts</a></li>
        <li class="nav-item"><a href="/pipeline" class="nav-link link-dark">Pipeline</a></li>
        <li class="nav-item"><a href="/tasks" class="nav-link link-dark">Tasks</a></li>
        <li class="nav-item"><a href="/reports" class="nav-link link-dark">Reports</a></li>
      </ul>
    </nav>
    <main class="flex-grow-1 p-4">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', path='bootstrap/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
